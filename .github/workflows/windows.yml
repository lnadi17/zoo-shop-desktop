name: Windows executable
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: npm ci
      - run: bun test
      - run: npm run windows
      - run: node scripts/smoke.mjs dist/Zoo-Shop-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Zoo-Shop-Windows-x64
          path: dist/Zoo-Shop-Windows-x64.exe
          if-no-files-found: error
