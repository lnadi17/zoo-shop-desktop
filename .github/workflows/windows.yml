name: Windows executable
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.6/bun-windows-x64-baseline.zip
      - run: npm ci
      - run: bun test
      - run: npm run windows
      - run: node scripts/smoke.mjs dist/Zoo-Shop-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Zoo-Shop-Windows-x64
          path: dist/Zoo-Shop-Windows-x64.exe
          if-no-files-found: error
